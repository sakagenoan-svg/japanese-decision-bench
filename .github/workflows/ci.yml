name: ci

# No API calls in CI: cost, key exposure, model drift, rate limits, reproducibility.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run python -m bench.validate
      - name: report smoke test (sanitized results only)
        run: uv run python -m bench.report --no-figures
      - name: secret scan (working tree + history)
        run: |
          uv run python scripts/secret_scan.py
          uv run python scripts/secret_scan.py --history
