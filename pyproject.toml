[project]
name = "japanese-decision-bench"
version = "0.1.0"
description = "Synthetic Japanese evaluation suite for classification, scoring, context-dependent decisions, and surface-form robustness"
readme = "README.md"
license = { text = "MIT (code) / CC BY 4.0 (data)" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.60",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
"scripts/build_dataset.py" = ["E501"]  # authored Japanese text is kept one example per line
